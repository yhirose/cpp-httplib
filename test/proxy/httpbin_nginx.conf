server {
    listen 80;
    server_name httpbin;

    location / {
        proxy_pass http://httpbin_backend:8080;
        proxy_set_header Host $host;
    }
}

server {
    listen 443 ssl;
    server_name httpbin;

    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    location / {
        proxy_pass http://httpbin_backend:8080;
        proxy_set_header Host $host;
    }
}
